  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 -webkit-overflow-scrolling:touch; font-family:'Libre Franklin',system-ui,sans-serif; color:#1b2a44;\">\n\n  <div style=\"{{ t.bg }}\"><\u002Fdiv>\n\n  <div style=\"position:relative; z-index:1; padding-bottom:26px;\">\n\n    <!-- HEADER -->\n    <div style=\"padding:36px 18px 12px; text-align:center;\">\n      <div style=\"display: inline-block; background: #2f5aa6; border-radius: 16px; padding: 15px 26px 13px; box-shadow: 0 6px 0 rgba(15,25,55,.32); border: 3px solid rgba(255,255,255,.55); width: 210px; height: 83px\">\n        <div style=\"font-family: Merriweather; font-weight: 500; font-size: 38px; line-height: .84; color: #f4ecd6; letter-spacing: 1px\">NATIONAL<\u002Fdiv>\n        <div style=\"font-family: Merriweather; font-weight: 500; font-size: 38px; line-height: .84; color: #f4ecd6; letter-spacing: 1px\">TREASURE<\u002Fdiv><span style=\"font-family: DM Sans; color: #F7F0DA; font-size: 14px; line-height: 1; width: 244px; height: 47px\">life, liberty &amp; the pursuit of loot<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:13px; display:flex; align-items:center; justify-content:center; gap:9px;\">\n        <span style=\"height:3px; width:30px; background:#cf4436; border-radius:2px;\"><\u002Fspan>\n        \n        <span style=\"height:3px; width:30px; background:#cf4436; border-radius:2px;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TEAMS -->\n    <div style=\"padding:0 14px; margin-bottom:14px;\">\n      <div style=\"{{ t.panel }}\">\n        <div style=\"padding:15px 15px 16px;\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;\">\n            <div style=\"font-family: Passion One; font-weight: 400; font-size: 24px; color: #1b2a44; letter-spacing: .5px; text-transform: uppercase\">TEAMS<\u002Fdiv>\n            <div style=\"display:flex; gap:6px;\">\n              <button onclick=\"{{ resetScores }}\" style=\"border:2px solid rgba(27,42,68,.18); cursor:pointer; font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:12px; padding:6px 9px; border-radius:9px; background:#fff; color:#1b2a44;\">Reset<\u002Fbutton>\n              <button onclick=\"{{ clearTeams }}\" style=\"border:2px solid rgba(207,68,54,.35); cursor:pointer; font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:12px; padding:6px 9px; border-radius:9px; background:#fff; color:#cf4436;\">Clear<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:8px;\">\n            <input value=\"{{ newName }}\" onchange=\"{{ onName }}\" onkeydown=\"{{ onKey }}\" placeholder=\"Add a team, e.g. The Firecrackers\" style=\"flex:1; min-width:0; font-family:'Libre Franklin',sans-serif; font-size:15px; padding:12px 12px; border-radius:12px; border:2px solid rgba(27,42,68,.16); background:#fff; color:#1b2a44;\">\n            <button onclick=\"{{ addTeam }}\" style=\"flex: none; border: 0; cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 400; font-size: 16px; padding: 0 18px; border-radius: 12px; background: #2f5aa6; color: #f4ecd6; box-shadow: 0 4px 0 rgba(15,25,55,.35)\">ADD<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasTeams }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ teamRows }}\" as=\"team\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:2px solid rgba(27,42,68,.12); border-radius:14px; padding:10px 12px; margin-top:10px;\">\n                <div style=\"min-width:0; flex:1;\">\n                  <div style=\"font-family: 'Passion One',sans-serif; font-weight: 400; font-size: 18px; color: #1b2a44; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase\">{{ team.name }}<\u002Fdiv>\n                  <div style=\"display:flex; gap:6px; margin-top:7px;\">\n                    <button onclick=\"{{ team.dec10 }}\" style=\"border:2px solid rgba(27,42,68,.14); cursor:pointer; font-family:'Passion One',sans-serif; font-weight:700; font-size:13px; padding:5px 8px; border-radius:9px; background:#f4ecd6; color:#1b2a44;\">-10<\u002Fbutton>\n                    <button onclick=\"{{ team.dec5 }}\" style=\"border:2px solid rgba(27,42,68,.14); cursor:pointer; font-family:'Passion One',sans-serif; font-weight:700; font-size:13px; padding:5px 8px; border-radius:9px; background:#f4ecd6; color:#1b2a44;\">-5<\u002Fbutton>\n                    <button onclick=\"{{ team.inc5 }}\" style=\"border:2px solid rgba(47,90,166,.3); cursor:pointer; font-family:'Passion One',sans-serif; font-weight:700; font-size:13px; padding:5px 8px; border-radius:9px; background:#e7effa; color:#2f5aa6;\">+5<\u002Fbutton>\n                    <button onclick=\"{{ team.inc10 }}\" style=\"border:2px solid rgba(47,90,166,.3); cursor:pointer; font-family:'Passion One',sans-serif; font-weight:700; font-size:13px; padding:5px 8px; border-radius:9px; background:#e7effa; color:#2f5aa6;\">+10<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 34px; color: #cf4436; line-height: 1; min-width: 52px; text-align: right\">{{ team.score }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noTeams }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 0; font-size:14px; color:#6b6250; text-align:center;\">No teams yet — add 2 to 4 above.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- THE DIVE -->\n    <div style=\"padding:0 14px; margin-bottom:12px;\">\n      <div style=\"{{ t.panel }}\">\n        <div style=\"padding:15px 15px 16px;\">\n          <div style=\"font-family: Passion One; font-weight: 300; font-size: 24px; color: #1b2a44; letter-spacing: .5px; text-transform: uppercase\">THE DIVE<\u002Fdiv>\n          <p style=\"margin:5px 0 12px; font-size:13.5px; color:#6b6250;\">Diver's back up — tap what they hauled from the deep.<\u002Fp>\n\n          <button onclick=\"{{ dive5 }}\" style=\"display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; cursor:pointer; background:#cf4436; border-radius:16px; padding:13px 15px; margin-top:0; box-shadow:0 5px 0 rgba(120,28,22,.55);\">\n            <span style=\"flex: none; width: 46px; height: 46px; border-radius: 50%; background: #f0d27a; border: 3px solid #c79f38; display: flex; align-items: center; justify-content: center; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 20px; color: #7a5a12\">5<\u002Fspan>\n            <span style=\"flex:1;\">\n              <span style=\"display: block; font-family: Passion One; font-weight: 300; font-size: 20px; color: #f4ecd6; line-height: 1; text-transform: uppercase\">5-Point Coin<\u002Fspan>\n              <span style=\"display:block; font-size:12.5px; color:rgba(255,244,220,.85); margin-top:3px;\">Answer trivia to bank it.<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n\n          <button onclick=\"{{ dive10 }}\" style=\"display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; cursor:pointer; background:#2f5aa6; border-radius:16px; padding:13px 15px; margin-top:11px; box-shadow:0 5px 0 rgba(18,36,90,.55);\">\n            <span style=\"flex: none; width: 46px; height: 46px; border-radius: 50%; background: #e9edf5; border: 3px solid #9fb2d4; display: flex; align-items: center; justify-content: center; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 18px; color: #2f5aa6\">10<\u002Fspan>\n            <span style=\"flex:1;\">\n              <span style=\"display: block; font-family: Passion One; font-weight: 300; font-size: 20px; color: #f4ecd6; line-height: 1; text-transform: uppercase\">10-Point Coin<\u002Fspan>\n              <span style=\"display:block; font-size:12.5px; color:rgba(255,244,220,.85); margin-top:3px;\">Tougher trivia, bigger reward.<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n\n          <button onclick=\"{{ diveGem }}\" style=\"display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; cursor:pointer; background:#e7c15a; border-radius:16px; padding:13px 15px; margin-top:11px; box-shadow:0 5px 0 rgba(150,110,20,.5);\">\n            <span style=\"flex:none; width:42px; height:42px; background:#3aa6b0; border:3px solid #227e88; transform:rotate(45deg); border-radius:6px; margin:2px;\"><\u002Fspan>\n            <span style=\"flex:1;\">\n              <span style=\"display: block; font-family: Passion One; font-weight: 300; font-size: 20px; color: #5a4410; line-height: 1; text-transform: uppercase\">Gem Card<\u002Fspan>\n              <span style=\"display:block; font-size:12.5px; color:rgba(90,68,16,.8); margin-top:3px;\">A twist of fate — no trivia needed.<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 2px 18px 0; text-align: center; font-size: 12px; color: #000714; line-height: 1.4\">Wrong answer? The treasure sinks back to the bottom of the pool.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- TRANSIENT NOTE -->\n  <sc-if value=\"{{ note }}\" hint-placeholder-val=\"\">\n    <div style=\"position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:70; background:#1b2a44; color:#f4ecd6; font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:14px; padding:11px 18px; border-radius:999px; box-shadow:0 10px 24px rgba(0,0,0,.35);\">{{ note }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- MODAL -->\n  <sc-if value=\"{{ showModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; z-index:60; background:rgba(15,20,40,.72); display:flex; align-items:center; justify-content:center; padding:16px;\">\n      <div style=\"width:100%; max-width:340px; background:#f4ecd6; border-radius:22px; border:4px solid #fff; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.5);\">\n\n        <div style=\"color: #f4ecd6; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background-color: #cf4436\">\n          <div style=\"font-family: 'Passion One',sans-serif; font-weight: 400; font-size: 18px; letter-spacing: .5px; text-transform: uppercase\">{{ mTitle }}<\u002Fdiv>\n          <div style=\"flex: none; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); padding: 5px 11px; border-radius: 999px; font-family: 'Passion One',sans-serif; font-weight: 400; font-size: 14px; white-space: nowrap\">{{ mBadge }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:18px 16px 6px;\">\n          <div style=\"text-transform:uppercase; letter-spacing:.09em; color:#a83b2f; font-size:11px; font-weight:700; margin-bottom:9px;\">{{ mCategory }}<\u002Fdiv>\n          <p style=\"font-family: Libre Franklin; font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0 0 14px; color: #1b2a44\">{{ mQuestion }}<\u002Fp>\n\n          <sc-if value=\"{{ showAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff; border:2px dashed #e0a445; border-radius:14px; padding:12px 14px; font-size:16px; font-weight:600; color:#1b2a44; margin:0 0 14px;\">{{ mAnswer }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasTeams }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-bottom:6px;\">\n              <label style=\"display:block; text-transform:uppercase; letter-spacing:.08em; color:#6b6250; font-size:11px; font-weight:700; margin-bottom:6px;\">{{ mApplyLabel }}<\u002Flabel>\n              <select value=\"{{ selTeam }}\" onchange=\"{{ setSel }}\" style=\"width:100%; font-family:'Libre Franklin',sans-serif; font-size:15px; padding:11px 12px; border-radius:12px; border:2px solid rgba(27,42,68,.16); background:#fff; color:#1b2a44;\">\n                <sc-for list=\"{{ teamRows }}\" as=\"team\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ team.idx }}\">{{ team.optLabel }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fselect>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- QUESTION ACTIONS -->\n        <sc-if value=\"{{ isQuestion }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:8px 16px 16px;\">\n            <button onclick=\"{{ reveal }}\" style=\"width:100%; border:2px solid rgba(27,42,68,.18); cursor:pointer; font-family:'Passion One',sans-serif; font-weight:700; font-size:15px; padding:11px; border-radius:13px; background:#fff; color:#1b2a44; margin-bottom:10px;\">Reveal Answer<\u002Fbutton>\n            <div style=\"display:flex; gap:10px;\">\n              <button onclick=\"{{ correct }}\" style=\"flex: 1; border: 0; cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 15px; padding: 13px; border-radius: 13px; background: #1f8a5b; color: #fff; box-shadow: 0 4px 0 rgba(18,90,60,.5); text-transform: uppercase\">{{ correctLabel }}<\u002Fbutton>\n              <button onclick=\"{{ missed }}\" style=\"flex: 1; border: 2px solid #cf4436; cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 15px; padding: 13px; border-radius: 13px; background: #fff; color: #cf4436; text-transform: uppercase\">Missed<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- GEM ACTIONS -->\n        <sc-if value=\"{{ isGem }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:8px 16px 16px;\">\n            <div style=\"display:flex; gap:7px; margin-bottom:10px;\">\n              <button onclick=\"{{ gemDec10 }}\" style=\"flex: 1; border: 2px solid rgba(27,42,68,.14); cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 14px; padding: 9px 0; border-radius: 11px; background: #f4ecd6; color: #1b2a44\">-10<\u002Fbutton>\n              <button onclick=\"{{ gemDec5 }}\" style=\"flex: 1; border: 2px solid rgba(27,42,68,.14); cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 14px; padding: 9px 0; border-radius: 11px; background: #f4ecd6; color: #1b2a44\">-5<\u002Fbutton>\n              <button onclick=\"{{ gemInc5 }}\" style=\"flex: 1; border: 2px solid rgba(47,90,166,.3); cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 14px; padding: 9px 0; border-radius: 11px; background: #e7effa; color: #2f5aa6\">+5<\u002Fbutton>\n              <button onclick=\"{{ gemInc10 }}\" style=\"flex: 1; border: 2px solid rgba(47,90,166,.3); cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 14px; padding: 9px 0; border-radius: 11px; background: #e7effa; color: #2f5aa6\">+10<\u002Fbutton>\n              <button onclick=\"{{ gemInc15 }}\" style=\"flex: 1; border: 0; cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 14px; padding: 9px 0; border-radius: 11px; background: #e7c15a; color: #5a4410\">+15<\u002Fbutton>\n            <\u002Fdiv>\n            <button onclick=\"{{ close }}\" style=\"width: 100%; border: 0; cursor: pointer; font-family: 'Passion One',sans-serif; font-weight: 500; font-size: 15px; padding: 12px; border-radius: 13px; background: #1b2a44; color: #f4ecd6; text-transform: uppercase\">Done<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:800},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signboard&quot;,&quot;fullstripe&quot;],&quot;default&quot;:&quot;signboard&quot;,&quot;tsType&quot;:&quot;'signboard' | 'fullstripe'&quot;}}\">\nclass Component extends DCLogic {\n  q5 = [\n    {cat:\"Independence Day\", q:\"What date is Independence Day celebrated in the U.S.?\", a:\"July 4\"},\n    {cat:\"U.S. Symbols\", q:\"What bird is the national bird of the United States?\", a:\"The bald eagle\"},\n    {cat:\"Geography\", q:\"Which state is nicknamed the Grand Canyon State?\", a:\"Arizona\"},\n    {cat:\"Government\", q:\"How many branches of government does the U.S. have?\", a:\"Three\"},\n    {cat:\"Pop Culture\", q:\"Which animated family lives at 742 Evergreen Terrace?\", a:\"The Simpsons\"},\n    {cat:\"Food\", q:\"Which fast-food chain is famous for the Big Mac?\", a:\"McDonald's\"},\n    {cat:\"Sports\", q:\"Which sport is often called America's pastime?\", a:\"Baseball\"},\n    {cat:\"Presidents\", q:\"Which president is on the penny?\", a:\"Abraham Lincoln\"},\n    {cat:\"Music\", q:\"Who sang 'Born in the U.S.A.'?\", a:\"Bruce Springsteen\"},\n    {cat:\"U.S. Flag\", q:\"How many stars are on the current U.S. flag?\", a:\"50\"},\n    {cat:\"Constitution\", q:\"What are the first ten amendments called?\", a:\"The Bill of Rights\"},\n    {cat:\"Pop Culture\", q:\"Which social platform was formerly known as Twitter?\", a:\"X\"},\n    {cat:\"Geography\", q:\"Which is larger by area, Alaska or Texas?\", a:\"Alaska\"},\n    {cat:\"Food\", q:\"What soft drink was invented in Atlanta?\", a:\"Coca-Cola\"},\n    {cat:\"Movies\", q:\"Which movie has the line 'Life is like a box of chocolates'?\", a:\"Forrest Gump\"},\n    {cat:\"Government\", q:\"What is the highest court in the United States?\", a:\"The Supreme Court\"},\n    {cat:\"States\", q:\"Which state is famous for potatoes?\", a:\"Idaho\"},\n    {cat:\"Fourth of July\", q:\"Which food is strongly associated with July 4th cookouts?\", a:\"Hot dogs / burgers / BBQ\"},\n    {cat:\"Landmarks\", q:\"Which state is home to Mount Rushmore?\", a:\"South Dakota\"},\n    {cat:\"Presidents\", q:\"Which president appears on the $1 bill?\", a:\"George Washington\"}\n  ];\n  q10 = [\n    {cat:\"Declaration\", q:\"Who is credited as the main author of the Declaration of Independence?\", a:\"Thomas Jefferson\"},\n    {cat:\"Declaration\", q:\"In what city was the Declaration of Independence signed?\", a:\"Philadelphia\"},\n    {cat:\"Constitution\", q:\"How many amendments does the U.S. Constitution currently have?\", a:\"27\"},\n    {cat:\"Government\", q:\"How many U.S. Senators does each state have?\", a:\"Two\"},\n    {cat:\"Presidents\", q:\"What is the minimum age to become U.S. President?\", a:\"35\"},\n    {cat:\"History\", q:\"Which president purchased the Louisiana Territory?\", a:\"Thomas Jefferson\"},\n    {cat:\"National Parks\", q:\"What was the first national park in the United States?\", a:\"Yellowstone\"},\n    {cat:\"U.S. Flag\", q:\"How many stripes are on the U.S. flag?\", a:\"13\"},\n    {cat:\"Weird America\", q:\"Which U.S. state has only one syllable in its name?\", a:\"Maine\"},\n    {cat:\"Pop Culture\", q:\"Which sitcom is set in the fictional town of Pawnee, Indiana?\", a:\"Parks and Recreation\"},\n    {cat:\"Sports\", q:\"How many points is a touchdown worth before the extra point?\", a:\"Six\"},\n    {cat:\"Geography\", q:\"Which state has the most national parks?\", a:\"California\"},\n    {cat:\"History\", q:\"During which war was the Declaration of Independence written?\", a:\"The American Revolutionary War\"},\n    {cat:\"Landmarks\", q:\"Which Nevada site is tied to UFO conspiracy theories?\", a:\"Area 51\"},\n    {cat:\"Music\", q:\"Which city is widely known as the birthplace of jazz?\", a:\"New Orleans\"},\n    {cat:\"Food\", q:\"What candy 'melts in your mouth, not in your hand'?\", a:\"M&M's\"},\n    {cat:\"Modern America\", q:\"Which platform is known for short-form dance and trend videos?\", a:\"TikTok\"},\n    {cat:\"Presidents\", q:\"Which president appears on the $20 bill?\", a:\"Andrew Jackson\"},\n    {cat:\"Constitution\", q:\"Which branch of government interprets the laws?\", a:\"The judicial branch\"},\n    {cat:\"Fourth of July\", q:\"Which city hosts Nathan's famous Hot Dog Eating Contest?\", a:\"New York City (Coney Island)\"}\n  ];\n  gems = [\n    {name:\"Liberty Bell\", text:\"Steal 10 points from any team.\"},\n    {name:\"Constitution Shield\", text:\"Save this card. Use it to block one penalty or wrong-answer loss.\"},\n    {name:\"Fireworks Finale\", text:\"Every other team loses 5 points.\"},\n    {name:\"Bald Eagle Bonus\", text:\"Answer a 5-point question correctly and earn 15 instead.\"},\n    {name:\"Mount Rushmore\", text:\"Choose four people to answer together. If correct, earn 10 points.\"},\n    {name:\"Founding Father Flex\", text:\"Choose another team to answer a 10-pt question. If they miss, you get 10.\"},\n    {name:\"Stars & Stripes\", text:\"Double the points from your next correct answer.\"},\n    {name:\"Boston Tea Party\", text:\"Dump 5 points from the team currently in first place.\"},\n    {name:\"Hidden Map\", text:\"Peek at the answer before deciding to answer. Pass = no gain, no loss.\"},\n    {name:\"National Archive\", text:\"Revive one missed question from earlier. Correct answer earns its value.\"},\n    {name:\"Uncle Sam Tax\", text:\"Collect 5 points from every team with more points than you.\"},\n    {name:\"Pool Party Patriot\", text:\"Pick a teammate for a dramatic cannonball. Group approves = gain 10.\"},\n    {name:\"The Great Compromise\", text:\"Split 20 points between any two teams however you want.\"},\n    {name:\"Declaration Duel\", text:\"Challenge another team to a 5-pt question. Winner gets 10 points.\"},\n    {name:\"Treasure Insurance\", text:\"Your team cannot lose points this round.\"}\n  ];\n\n  state = { teams: [], modal: null, revealed: false, selTeam: 0, newName: '', note: '' };\n\n  getKey() { return 'nt_teams_' + (this.props.variant || 'v'); }\n\n  componentDidMount() {\n    let teams = [];\n    try { teams = JSON.parse(localStorage.getItem(this.getKey()) || '[]') || []; } catch (e) {}\n    if (!teams.length) teams = [{name:'The Firecrackers', score:25}, {name:'Deep Enders', score:15}];\n    this.setState({ teams });\n  }\n  persist = () => { try { localStorage.setItem(this.getKey(), JSON.stringify(this.state.teams)); } catch (e) {} };\n\n  shuffle(n) { const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }\n  drawDeck(kind) {\n    const map = {'5':this.q5, '10':this.q10, 'gem':this.gems};\n    const arr = map[kind];\n    if (!this.decks) this.decks = {};\n    let d = this.decks[kind];\n    if (!d || d.pos >= arr.length) { d = { order: this.shuffle(arr.length), pos: 0 }; this.decks[kind] = d; }\n    const item = arr[d.order[d.pos]]; d.pos++;\n    return item;\n  }\n  dive(kind) {\n    const item = this.drawDeck(kind);\n    const modal = kind === 'gem'\n      ? { type:'gem', name:item.name, text:item.text }\n      : { type:'question', points: kind === '5' ? 5 : 10, cat:item.cat, q:item.q, a:item.a };\n    this.setState({ modal, revealed:false });\n  }\n\n  addTeam() {\n    const name = (this.state.newName || '').trim();\n    if (!name) return;\n    this.setState(s => ({ teams:[...s.teams, {name, score:0}], newName:'' }), this.persist);\n  }\n  adjust(i, pts) {\n    if (!this.state.teams[i]) return;\n    this.setState(s => ({ teams: s.teams.map((t,idx) => idx===i ? {...t, score:t.score+pts} : t) }), this.persist);\n  }\n  resetScores() { this.setState(s => ({ teams: s.teams.map(t => ({...t, score:0})) }), this.persist); }\n  clearTeams() { if (confirm('Clear all teams?')) this.setState({ teams:[], selTeam:0 }, this.persist); }\n\n  correct() {\n    const i = this.state.selTeam, m = this.state.modal;\n    if (!m || m.type !== 'question' || !this.state.teams[i]) { this.setState({ modal:null }); return; }\n    this.setState(s => ({ teams: s.teams.map((t,idx) => idx===i ? {...t, score:t.score+m.points} : t), modal:null }), this.persist);\n  }\n  missed() {\n    this.setState({ modal:null, note:'\\u21A9 Back in the pool — no points!' });\n    clearTimeout(this._nt);\n    this._nt = setTimeout(() => this.setState({ note:'' }), 2400);\n  }\n  gemAdjust(pts) {\n    const i = this.state.selTeam;\n    if (!this.state.teams[i]) return;\n    this.setState(s => ({ teams: s.teams.map((t,idx) => idx===i ? {...t, score:t.score+pts} : t) }), this.persist);\n  }\n\n  theme() {\n    const full = this.props.variant === 'fullstripe';\n    return {\n      bg: full\n        ? { background:'repeating-linear-gradient(90deg,#cf4436 0 15px,#efe3c4 15px 30px)', position:'absolute', inset:0, zIndex:0 }\n        : { background:'#f4ecd6', position:'absolute', inset:0, zIndex:0 },\n      panel: full\n        ? { background:'#f7f0da', border:'4px solid #fbf6e6', borderRadius:'18px', boxShadow:'0 12px 26px rgba(15,20,45,.30)' }\n        : { background:'#fbf6e6', border:'2px solid rgba(27,42,68,.14)', borderRadius:'18px', boxShadow:'0 4px 0 rgba(27,42,68,.07)' }\n    };\n  }\n\n  renderVals() {\n    const s = this.state, m = s.modal;\n    const teamRows = s.teams.map((tm, i) => ({\n      name: tm.name, score: tm.score, idx: i,\n      optLabel: tm.name + ' (' + tm.score + ')',\n      dec10: () => this.adjust(i,-10), dec5: () => this.adjust(i,-5),\n      inc5: () => this.adjust(i,5), inc10: () => this.adjust(i,10)\n    }));\n    return {\n      t: this.theme(),\n      teamRows, hasTeams: s.teams.length > 0, noTeams: s.teams.length === 0,\n      newName: s.newName,\n      onName: (e) => this.setState({ newName: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter') this.addTeam(); },\n      addTeam: () => this.addTeam(),\n      resetScores: () => this.resetScores(),\n      clearTeams: () => this.clearTeams(),\n      dive5: () => this.dive('5'), dive10: () => this.dive('10'), diveGem: () => this.dive('gem'),\n      showModal: !!m,\n      isQuestion: !!m && m.type === 'question',\n      isGem: !!m && m.type === 'gem',\n      mTitle: m ? (m.type === 'gem' ? 'Gem Card' : 'Trivia Question') : '',\n      mBadge: m ? (m.type === 'gem' ? 'GEM' : m.points + ' PTS') : '',\n      mCategory: m ? (m.type === 'gem' ? m.name : m.cat) : '',\n      mQuestion: m ? (m.type === 'gem' ? m.text : m.q) : '',\n      mAnswer: m && m.type === 'question' ? m.a : '',\n      mApplyLabel: m && m.type === 'gem' ? 'Apply gem to' : 'Answering team',\n      showAnswer: !!m && m.type === 'question' && s.revealed,\n      revealed: s.revealed,\n      reveal: () => this.setState({ revealed:true }),\n      correct: () => this.correct(),\n      missed: () => this.missed(),\n      correctLabel: m && m.type === 'question' ? 'Correct  +' + m.points : 'Correct',\n      close: () => this.setState({ modal:null }),\n      selTeam: s.selTeam,\n      setSel: (e) => this.setState({ selTeam: +e.target.value }),\n      gemDec5: () => this.gemAdjust(-5), gemDec10: () => this.gemAdjust(-10),\n      gemInc5: () => this.gemAdjust(5), gemInc10: () => this.gemAdjust(10), gemInc15: () => this.gemAdjust(15),\n      note: s.note\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
